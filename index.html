<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>بيانات المستخدم</title>
</head>
<body>
    <div class="card">
        <h1 id="formTitle">ادخل بياناتك</h1>
        <form id="userForm" novalidate>
            <label for="name">الاسم</label>
            <input type="text" id="name" placeholder="أكتب اسمك">
            <div class="error" id="nameError"></div>

            <label for="age"> العمر</label>
            <input type="number" id="age" placeholder="العمر">
            <div class="error" id="ageError"></div>

            <label for="email">الايميل</label>
            <input type="email" id="email" placeholder="الايميل الخاص بك">
            <div class="error" id="emailError"></div>

            <label for="address">العنوان </label>
            <input type="text" id="address" placeholder="ادخل العنوان ">
            <div class="error" id="addressError"></div>
            <button class="bb" id="dd" type="submit">حفظ</button>
            <button class="gh" id="cancelBtn" type="button" hidden>إلغاء التعديل</button>


        </form>

        <div id="result"></div>


    </div>
    <div class="card2">
        <div class="hd">
            <h2>المسجلون</h2>
            <span><button id="cl" class="lk" type="button">مسح الكل</button> <button class="half" id="th" type="button" aria-label="تبديل الوضع الليلى"></button></span>
</div>
            <div class="stats">
                <div><b id="cnt">.</b><span>عدد المسجلين</span></div>
                <div><b id="avg">.</b><span>متوسط العمر</span></div>
                <div><b id="old">-</b><span>الأكبرسننا</span></div>
            </div>
                <div class="tools"><input id="q" type="search" placeholder="ابحث بالاسم او الايميل " aria-label="بحث">
                <select  id="so" aria-label="ترتيب"> 
                    <option value="new">الأحدث</option>
                    <option value="name">الأسم</option>
                    <option value="age">العمر</option>
                </select>
            </div>
            <div class="ch" id="ch"></div>
            <ul class="is"id="is"></ul>

        </div>


    <div class="toast" id="ts" role="status"></div>


    <script src="./js/main.js"></script>
</body>
</html>
